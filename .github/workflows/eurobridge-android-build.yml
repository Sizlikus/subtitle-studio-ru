name: EuroBridge Android APK

on:
  push:
    branches:
      - eurobridge-android-013
    paths:
      - 'build/eurobridge_patch/**'
      - 'build/eurobridge_012_patch/**'
      - 'build/eurobridge_013.patch'
      - '.github/workflows/eurobridge-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble and verify base source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/EuroBridgeAndroid_project.zip"
          cat build/eurobridge_chunks/part* | tr -d '\r\n' | base64 --decode > "$ARCHIVE"
          echo "8593c9ccc925506edbff0ee326be1ab53544b8e6e61cbb8be6b667b8a8082a0a  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/eurobridge-src"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/eurobridge-src"
          test -f "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid/settings.gradle"

      - name: Apply EuroBridge 0.1.1 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/eurobridge-0.1.1.patch"
          cat build/eurobridge_patch/part* > "$PATCH"
          cd "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid"
          patch --batch --forward -p0 < "$PATCH"
          grep -q "versionName = '0.1.1'" app/build.gradle
          grep -q "extraCountrySpinner" app/src/main/java/com/eurobridge/vpn/MainActivity.java
          grep -q "TimeUnit.SECONDS.toNanos(12)" app/src/main/java/com/eurobridge/vpn/VpnGateClient.java

      - name: Apply EuroBridge 0.1.2 profile-size patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/eurobridge-0.1.2.patch"
          cat build/eurobridge_012_patch/part* | tr -d '\r\n' | base64 --decode > "$PATCH"
          cd "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid"
          patch --batch --forward -p1 < "$PATCH"
          grep -q "versionName = '0.1.2'" app/build.gradle
          grep -q "profileBytes.length >= 240 \* 1024" app/src/main/java/com/eurobridge/vpn/MainActivity.java
          grep -q 'trimmed.startsWith("#")' app/src/main/java/com/eurobridge/vpn/MainActivity.java

      - name: Apply EuroBridge 0.1.3 save-profile patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/build/eurobridge_013.patch"
          cd "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid"
          patch --batch --forward -p1 < "$PATCH"
          grep -q "versionName = '0.1.3'" app/build.gradle
          grep -q "saveProfileButton" app/src/main/java/com/eurobridge/vpn/MainActivity.java
          grep -q "ACTION_CREATE_DOCUMENT" app/src/main/java/com/eurobridge/vpn/MainActivity.java
          grep -q "меньше 256 КБ" app/src/main/java/com/eurobridge/vpn/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EuroBridgeVPN-0.1.3-debug-apk
          path: ${{ runner.temp }}/eurobridge-src/EuroBridgeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
