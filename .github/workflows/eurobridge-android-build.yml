name: EuroBridge Android APK

on:
  push:
    branches:
      - eurobridge-android-build
    paths:
      - 'build/eurobridge_chunks/**'
      - '.github/workflows/eurobridge-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/EuroBridgeAndroid_project.zip"
          cat build/eurobridge_chunks/part* | tr -d '\r\n' | base64 --decode > "$ARCHIVE"
          echo "d1248238c5b58696d27827fb631a488c41e0e18f9caed9bd540893ea9b1cc039  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/eurobridge-src"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/eurobridge-src"
          test -f "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid/settings.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/eurobridge-src/EuroBridgeAndroid"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EuroBridgeVPN-0.1.1-debug-apk
          path: ${{ runner.temp }}/eurobridge-src/EuroBridgeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
